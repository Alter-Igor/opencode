# Shared upstream settings for every generated server (servers.conf includes this inside its
# location, next to its own Host header: nginx does not inherit proxy_set_header into a location
# that sets one). Verified TLS to the one fixed upstream, SNI forced by proxy_ssl_name.
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_session_reuse on;
# HTTP/1.1 upstream; MCP and model calls stream (SSE / streamable HTTP), so nothing is buffered
# and reads may stay open for a long time.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering off;
proxy_request_buffering off;
proxy_connect_timeout 15s;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_redirect off;
