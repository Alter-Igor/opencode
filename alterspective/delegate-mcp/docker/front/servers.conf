        set $front_upstream "identity.alterspective.com.au";
        proxy_pass https://$front_upstream;
        proxy_ssl_name identity.alterspective.com.au;
        proxy_set_header Host identity.alterspective.com.au;
        include /etc/nginx/front/upstream.conf;
    }
}

