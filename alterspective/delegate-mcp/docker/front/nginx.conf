# front (FEAT-OCD-001 §1, review R3-01, R4-01). Static part; the servers are generated by the bridge
# (servers.conf, mounted read-only from the bridge home at /etc/nginx/front-gen).
# Runs as uid 101 with a read-only root: everything it writes is under the /tmp tmpfs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    # No URI and no headers in the log: query strings and headers can carry tokens. Two exceptions
    # (#76), neither a secret: the session id the box's OpenCode sends on model calls, and the model
    # Synapse says it served. nginx escapes `"` inside the quotes, so box text cannot fake a field.
    log_format front '$time_iso8601 sni=$ssl_server_name host=$host $request_method status=$status up=$upstream_status bytes=$body_bytes_sent sess="$http_x_opencode_session" served="$upstream_http_x_synapse_served_model"';
    access_log /dev/stdout front;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    ssl_protocols TLSv1.2 TLSv1.3;
    # Model prompts can be large; this is a size cap, not an exfiltration control.
    client_max_body_size 64m;

    # Upstream names are resolved by this resolver, never by Docker's DNS: on `sealed` the
    # allowed names are front's own aliases, so Docker's DNS would point front at itself.
    # Written at start from OCD_FRONT_RESOLVER (entrypoint.sh). Upstream identity rests on
    # certificate verification (upstream.conf), not on DNS.
    include /tmp/front/resolver.conf;
    # Published atomically by front-reload; includes only immutable, checked generations.
    include /tmp/front/current.conf;
}
