# egress: the sealed box's only way out (technical-design §1). Default deny.
# Only HTTPS tunnels (CONNECT) to port 443 of the hosts in allow.txt are permitted.
# allow.txt is generated from config.egressHosts by src/guard/egress.ts — do not edit it by hand.
#
# Plain HTTP is refused, even to an allowed host (review C-5). tinyproxy 1.11 has no
# "CONNECT only" option, so the filter does it: `FilterURLs On` matches each line against the
# request URL. A CONNECT's URL is `host:443`; a plain-HTTP request's URL is `http://host/...`.
# Every allow.txt line is `^host:443$`, so only CONNECT to an allowed host matches.
# Live proof (throwaway project, then down -v): OCD_LIVE_EGRESS=1 bun test test/egress-live.test.ts
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info
MaxClients 100
# Reachable only on the project's own networks (no published port); the host filter is the control.
Allow 0.0.0.0/0
DisableViaHeader Yes
ConnectPort 443
Filter "/etc/tinyproxy/allow.txt"
FilterType ere
FilterDefaultDeny Yes
FilterURLs On
