# Live check for the egress proxy and sealed-network DNS (reviews C-5, C-6).
# Run by test/egress-live.test.ts (set OCD_LIVE_EGRESS=1) under a throwaway project name, then
# torn down with `down -v`. It never touches the real `opencode-delegate` project.
#
# The same network shape as docker/compose.yaml: the client joins ONLY `sealed` (internal), like
# the box; egress joins `sealed` and `outside`. The client image is the box's base image.
networks:
  sealed:
    internal: true
  outside: {}

services:
  egress:
    build: ..
    networks: [sealed, outside]

  client:
    # Same pin as the box's runtime stage (docker/box/Dockerfile).
    image: node:22-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
    entrypoint: ["sleep", "600"]
    networks: [sealed]
    volumes:
      - ./client.mjs:/check/client.mjs:ro
    depends_on: [egress]
