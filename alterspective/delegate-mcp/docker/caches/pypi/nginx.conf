# pypi-cache: read-only pull-through cache of the PyPI simple index and files (FEAT-OCD-001 §4, review N3).
# Only GET/HEAD are served. Uploads go to upload.pypi.org, which is never proxied, so publishing
# through this service is impossible. Box setting: PIP_INDEX_URL=http://pypi-cache:5000/index/
proxy_cache_path /var/cache/nginx/pypi levels=1:2 keys_zone=pypi:20m max_size=10g inactive=30d use_temp_path=off;

server {
    listen 5000;
    server_tokens off;

    # Shared upstream settings: verified TLS with SNI.
    # proxy_set_header is NOT inherited into a location that sets its own, so each location repeats
    # the full header set (Accept-Encoding "" keeps bodies uncompressed so links can be rewritten).
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_cache pypi;
    proxy_cache_key $request_uri;
    proxy_ignore_headers Vary;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # Simple index (PEP 503). HTML is forced so file links can be rewritten to this cache.
    location /index/ {
        limit_except GET { deny all; }
        proxy_pass https://pypi.org/simple/;
        proxy_ssl_name pypi.org;
        proxy_set_header Host pypi.org;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept "text/html";
        proxy_redirect https://pypi.org/simple/ /index/;
        proxy_redirect /simple/ /index/;
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        sub_filter_types application/vnd.pypi.simple.v1+html;
        sub_filter_once off;
        sub_filter "https://files.pythonhosted.org/packages/" "/packages/";
    }

    # Distribution files (immutable, hash-pinned by the index links).
    location /packages/ {
        limit_except GET { deny all; }
        proxy_pass https://files.pythonhosted.org/packages/;
        proxy_ssl_name files.pythonhosted.org;
        proxy_set_header Host files.pythonhosted.org;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}
