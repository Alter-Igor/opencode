# FEAT-OCD-001 T1.2: the delegate sandbox (technical-design.md §1, §4).
# Started by src/supervisor/lifecycle.ts as:
#   docker compose -p <config.project> -f docker/compose.yaml -f <home>/compose.box-env.yaml up -d
# The default project is opencode-delegate. The box container is named after the project
# (OCD_CONTAINER), so a second project (e.g. a live test with -p ocd-fixtest) never clashes.
# Secrets never live in this file or any other file: OPENCODE_SERVER_PASSWORD, OPENCODE_MCP_ALLOW
# and the approved model keys are listed by NAME only, so Compose copies them from the
# environment of the `docker compose` child process. The override file adds the config.boxEnv names.
#
# Hardening (review C-1, C-2, C-7, C-9): every service drops all capabilities, cannot gain
# privileges, has a read-only root filesystem and pids/memory/CPU limits. Writable paths are
# tmpfs or named volumes only. Every service logs through the `local` driver capped at
# 3 x 10 MB, so a noisy container cannot fill the Docker host's disk (W2C-06).
name: opencode-delegate

networks:
  # No default route: the box can only reach services on this network.
  sealed:
    internal: true
  # MOD-05 (W2C-05, R3-02): gate-admin <-> inbox admin listener only. The box is NOT on this
  # network, the sidecar binds its admin listener to its address here, and the only listener that
  # forwards to it (gate-admin) is on `admin` + `outside`, never on `sealed`. So no network the box
  # is on holds a path to the admin routes (test/egress-compose.test.ts).
  admin:
    internal: true
  outside: {}

volumes:
  data: {}
  sessions: {}
  npm-storage: {}
  pypi-storage: {}
  # MOD-05 inbox messages (append-only JSONL). Never mounted into the box (review G5).
  inbox-storage: {}
  # R3-01: the internal CA. Its private key lives only here, mounted only in `front`.
  front-ca-private: {}
  # The CA certificate (public) that front publishes; mounted read-only in the box.
  front-ca-public: {}

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  box:
    <<: *hardened
    image: ${OCD_IMAGE:?OCD_IMAGE is set by the bridge}
    build:
      context: ../../..
      dockerfile: alterspective/delegate-mcp/docker/box/Dockerfile
      args:
        OPENCODE_VERSION: ${OCD_OPENCODE_VERSION:-0.0.0-alterspective-local}
    container_name: ${OCD_CONTAINER:-opencode-delegate}
    labels:
      com.alterspective.opencode-delegate.profile-hash: ${OCD_PROFILE_HASH:?OCD_PROFILE_HASH is set by the bridge}
      com.alterspective.opencode-delegate.port: ${OCD_PORT:?OCD_PORT is set by the bridge}
      com.alterspective.opencode-delegate.image: ${OCD_IMAGE}
    networks: [sealed]
    pids_limit: 512
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4
    tmpfs:
      # /tmp cannot run programs; /home/agent can (bun/npm/pip keep caches and bins there).
      - /tmp:mode=1777,nosuid,nodev,noexec
      - /home/agent:uid=10001,gid=10001,mode=0700,nosuid,nodev,exec
      # OpenCode also loads ~/.opencode (tools, plugins, agents) even with
      # OPENCODE_DISABLE_PROJECT_CONFIG, and /home/agent is writable by in-box code. An empty
      # root-owned read-only mount there means nothing can be planted for the server to load.
      - /home/agent/.opencode:uid=0,gid=0,mode=0555,size=4k,nosuid,nodev,noexec
    volumes:
      - data:/data
      - sessions:/sessions
      # Hand-off (review C-4): the host writes in/ (box reads only); the box writes out/.
      - ${OCD_HANDOFF_DIR:?OCD_HANDOFF_DIR is set by the bridge}/in:/handoff/in:ro
      - ${OCD_HANDOFF_DIR:?OCD_HANDOFF_DIR is set by the bridge}/out:/handoff/out
      - ${OCD_PROFILE_DIR:?OCD_PROFILE_DIR is set by the bridge}:/profile:ro
      # front's CA certificate only (the key never leaves front).
      - front-ca-public:/etc/ocd-front-ca:ro
    environment:
      XDG_CONFIG_HOME: /profile
      XDG_DATA_HOME: /data
      HOME: /home/agent
      # Box environment contract: docker/caches/README.md "Environment the box needs".
      # No proxy variables (R3-01): the allowed hosts resolve to `front` on `sealed` (its network
      # aliases), and the caches and inbox are plain service names on the same network.
      # front's internal CA: Bun (OpenCode) and Node read NODE_EXTRA_CA_CERTS at process start;
      # curl, git and Python read the others. Bun proven live (docker/caches/README.md "front").
      NODE_EXTRA_CA_CERTS: /etc/ocd-front-ca/ca.pem
      SSL_CERT_FILE: /etc/ocd-front-ca/ca.pem
      CURL_CA_BUNDLE: /etc/ocd-front-ca/ca.pem
      GIT_SSL_CAINFO: /etc/ocd-front-ca/ca.pem
      REQUESTS_CA_BUNDLE: /etc/ocd-front-ca/ca.pem
      # MOD-05: the in-box inbox tools post here. No token: box messages are stored unverified.
      OCD_INBOX_URL: http://inbox:8080
      npm_config_registry: http://npm-cache:4873/
      BUN_CONFIG_REGISTRY: http://npm-cache:4873/
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
      PIP_INDEX_URL: http://pypi-cache:5000/index/
      # pip ignores a plain-http index unless the host is trusted (internal network only).
      PIP_TRUSTED_HOST: pypi-cache
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      UV_DEFAULT_INDEX: http://pypi-cache:5000/index/
      UV_INSECURE_HOST: pypi-cache
      OPENCODE_DISABLE_MODELS_FETCH: "1"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      # Design §3: only the read-only profile configures OpenCode. A delegated repo's own
      # .opencode/ (plugins, tools, agents, commands) and opencode.json would otherwise load as
      # code INSIDE the server process. Side effect: OpenCode also stops reading the repo's
      # AGENTS.md / CLAUDE.md itself; the bridge passes instructions per session instead.
      OPENCODE_DISABLE_PROJECT_CONFIG: "1"
      # No skills from ~/.claude, ~/.agents or the repo, and no Claude Code prompt/skill discovery.
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
      OPENCODE_DISABLE_CLAUDE_CODE: "1"
      # By name only: values come from the `docker compose` process env, never a file.
      OPENCODE_MCP_ALLOW:
      OPENCODE_SERVER_PASSWORD:
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u \"opencode:$$OPENCODE_SERVER_PASSWORD\" 'http://127.0.0.1:4096/path?directory=/sessions'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      # The CA file must exist before OpenCode starts: Bun reads NODE_EXTRA_CA_CERTS once.
      front: { condition: service_healthy }
      inbox: { condition: service_started }
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]

  # Publishes the box API on the host loopback only. On `sealed` (to reach the box) and `outside`
  # (internal networks cannot publish ports). It forwards to the box only: the inbox admin API
  # has its own gate (R3-02), so nothing on `sealed` forwards to inbox-admin.
  gate-box:
    <<: *hardened
    # Pinned by version and digest (review C-7); resolved 2026-10-01 with
    # `docker buildx imagetools inspect alpine/socat:1.8.1.3` (same index digest as :latest then).
    image: alpine/socat:1.8.1.3@sha256:5ffbd6ae916cbad86a58fabe0d6d5a6fd5c2b47ddf031e82996baac9300e732f
    container_name: ${OCD_CONTAINER:-opencode-delegate}-gate-box
    user: "65534:65534"
    command: ["TCP-LISTEN:4096,fork,reuseaddr", "TCP:box:4096"]
    networks: [sealed, outside]
    ports: ["127.0.0.1:${OCD_PORT}:4096"]
    restart: unless-stopped
    # socat forks one process per connection (event streams stay open).
    pids_limit: 256
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    depends_on: [box]

  # Publishes the inbox admin API on the host loopback only (R3-02). On `admin` + `outside`, never
  # on `sealed`, so the box has no network path to any listener that forwards to inbox-admin.
  gate-admin:
    <<: *hardened
    image: alpine/socat:1.8.1.3@sha256:5ffbd6ae916cbad86a58fabe0d6d5a6fd5c2b47ddf031e82996baac9300e732f
    container_name: ${OCD_CONTAINER:-opencode-delegate}-gate-admin
    user: "65534:65534"
    command: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:inbox-admin:8081"]
    networks: [admin, outside]
    ports: ["127.0.0.1:${OCD_INBOX_PORT}:8081"]
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    depends_on: [inbox]

  # The services below are built from docker/ too (review N-9). Their images are named after the
  # box image, so a new checkout (a new OCD_IMAGE) builds new ones instead of reusing stale ones;
  # Compose builds a missing image on `up`. Each container carries the image label, and the
  # supervisor refuses to reuse a running set whose labels differ (profile_changed).
  #
  # front (R3-01, owned by MOD-02, docker/front): the box's only way out. A TLS-terminating
  # reverse proxy with ONE fixed upstream per allowed host (SNI, Host and certificate check forced
  # by front), replacing the old CONNECT proxy that let the box choose SNI/Host after CONNECT.
  # Name resolution (choice): network ALIASES on `sealed` plus an explicit nginx `resolver`.
  # - The box resolves each allowed name through Docker's DNS to front's `sealed` address.
  # - front would resolve its own aliases the same way (a loop, observed 2026-10-01), so nginx
  #   resolves upstreams with its own resolver (OCD_FRONT_RESOLVER, default 1.1.1.1 1.0.0.1, IPv4
  #   only). A spoofed answer cannot redirect traffic: front verifies the upstream certificate.
  # - Not a static IP + extra_hosts: that needs a fixed `sealed` subnet, which clashes between two
  #   projects (the default box and a throwaway test project) and with other Docker networks.
  # The aliases must equal config.egressHosts (src/guard/egress-check.ts checks this file).
  # Its servers (review R4-01: Keystone paths of the chosen connections only) are generated by the
  # bridge into <home>/front and mounted READ-ONLY; the front-config label is their sha256, so a
  # running front with another Keystone set is never reused.
  front:
    <<: *hardened
    build: ./front
    image: ${OCD_IMAGE}-front
    container_name: ${OCD_CONTAINER:-opencode-delegate}-front
    labels:
      com.alterspective.opencode-delegate.image: ${OCD_IMAGE}
      com.alterspective.opencode-delegate.front-config: ${OCD_FRONT_HASH:?OCD_FRONT_HASH is set by the bridge}
    networks:
      sealed:
        aliases:
          - identity.alterspective.com.au
          - synapse2-api.alterspective.com.au
      outside: {}
    # Binds :443 as uid 101 with no capabilities: this sysctl is per network namespace, so it
    # changes nothing outside this container.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    environment:
      OCD_FRONT_RESOLVER: ${OCD_FRONT_RESOLVER:-1.1.1.1 1.0.0.1}
    tmpfs: ["/tmp:uid=101,gid=101,mode=0700,nosuid,nodev,noexec"]
    volumes:
      - front-ca-private:/ca/private
      - front-ca-public:/ca/public
      - ${OCD_FRONT_DIR:?OCD_FRONT_DIR is set by the bridge}:/etc/nginx/front-gen:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /ca/public/ca.pem && test -s /tmp/front/leaf.pem && test -s /tmp/nginx.pid"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # One nginx worker (nginx.conf) plus the master and the healthcheck shell.
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1

  # Read-only pull-through package caches (owned by MOD-02, docker/caches).
  npm-cache:
    <<: *hardened
    build: ./caches/npm
    image: ${OCD_IMAGE}-npm-cache
    container_name: ${OCD_CONTAINER:-opencode-delegate}-npm-cache
    labels:
      com.alterspective.opencode-delegate.image: ${OCD_IMAGE}
    networks: [sealed, outside]
    restart: unless-stopped
    tmpfs: ["/tmp:mode=1777,nosuid,nodev,noexec"]
    volumes: ["npm-storage:/verdaccio/storage"]
    pids_limit: 256
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1

  pypi-cache:
    <<: *hardened
    build: ./caches/pypi
    image: ${OCD_IMAGE}-pypi-cache
    container_name: ${OCD_CONTAINER:-opencode-delegate}-pypi-cache
    labels:
      com.alterspective.opencode-delegate.image: ${OCD_IMAGE}
    networks: [sealed, outside]
    restart: unless-stopped
    tmpfs: ["/tmp:uid=101,gid=101,mode=0700,nosuid,nodev,noexec"]
    volumes: ["pypi-storage:/var/cache/nginx/pypi"]
    # nginx starts one worker per host CPU.
    pids_limit: 256
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1

  # MOD-05 agent inbox (technical-design.md §7, review G5; built from ../inbox-sidecar).
  # Internal networks only: it has no route to the internet (W2C-05).
  # - Box listener :8080 on `sealed`: the box reaches it as http://inbox:8080 with no token, so
  #   box messages are stored verified:false.
  # - Admin listener :8081, bound to its `admin` address (alias inbox-admin, which exists only on
  #   that network). gate-admin publishes it on host 127.0.0.1:${OCD_INBOX_PORT}; bridges call it with
  #   INBOX_ADMIN_TOKEN (by NAME only: from the compose child env, set on THIS service only, never
  #   on the box).
  inbox:
    <<: *hardened
    build: ../inbox-sidecar
    image: ${OCD_IMAGE}-inbox
    container_name: ${OCD_CONTAINER:-opencode-delegate}-inbox
    labels:
      com.alterspective.opencode-delegate.image: ${OCD_IMAGE}
      com.alterspective.opencode-delegate.inbox-port: ${OCD_INBOX_PORT:?OCD_INBOX_PORT is set by the bridge}
    networks:
      sealed: {}
      admin:
        aliases: [inbox-admin]
    restart: unless-stopped
    tmpfs: ["/tmp:mode=1777,nosuid,nodev,noexec"]
    volumes: ["inbox-storage:/data"]
    environment:
      INBOX_PORT: "8080"
      INBOX_ADMIN_PORT: "8081"
      INBOX_ADMIN_HOST: inbox-admin
      INBOX_ADMIN_PUBLIC_PORT: ${OCD_INBOX_PORT}
      INBOX_DATA_DIR: /data
      INBOX_ADMIN_TOKEN:
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
