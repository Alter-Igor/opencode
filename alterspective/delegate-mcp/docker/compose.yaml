# FEAT-OCD-001 T1.2: the delegate sandbox (technical-design.md §1, §4).
# Started by src/supervisor/lifecycle.ts as:
#   docker compose -p <config.project> -f docker/compose.yaml -f <home>/compose.box-env.yaml up -d
# The default project is opencode-delegate. The box container is named after the project
# (OCD_CONTAINER), so a second project (e.g. a live test with -p ocd-fixtest) never clashes.
# Secrets never live in this file or any other file: OPENCODE_SERVER_PASSWORD, OPENCODE_MCP_ALLOW
# and the approved model keys are listed by NAME only, so Compose copies them from the
# environment of the `docker compose` child process. The override file adds the config.boxEnv names.
#
# Hardening (review C-1, C-2, C-7, C-9): every service drops all capabilities, cannot gain
# privileges, has a read-only root filesystem and pids/memory/CPU limits. Writable paths are
# tmpfs or named volumes only.
name: opencode-delegate

networks:
  # No default route: the box can only reach services on this network.
  sealed:
    internal: true
  outside: {}

volumes:
  data: {}
  sessions: {}
  npm-storage: {}
  pypi-storage: {}
  # MOD-05 inbox messages (append-only JSONL). Never mounted into the box (review G5).
  inbox-storage: {}

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true

services:
  box:
    <<: *hardened
    image: ${OCD_IMAGE:?OCD_IMAGE is set by the bridge}
    build:
      context: ../../..
      dockerfile: alterspective/delegate-mcp/docker/box/Dockerfile
      args:
        OPENCODE_VERSION: ${OCD_OPENCODE_VERSION:-0.0.0-alterspective-local}
    container_name: ${OCD_CONTAINER:-opencode-delegate}
    labels:
      com.alterspective.opencode-delegate.profile-hash: ${OCD_PROFILE_HASH:?OCD_PROFILE_HASH is set by the bridge}
      com.alterspective.opencode-delegate.port: ${OCD_PORT:?OCD_PORT is set by the bridge}
      com.alterspective.opencode-delegate.image: ${OCD_IMAGE}
    networks: [sealed]
    pids_limit: 512
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4
    tmpfs:
      # /tmp cannot run programs; /home/agent can (bun/npm/pip keep caches and bins there).
      - /tmp:mode=1777,nosuid,nodev,noexec
      - /home/agent:uid=10001,gid=10001,mode=0700,nosuid,nodev,exec
    volumes:
      - data:/data
      - sessions:/sessions
      # Hand-off (review C-4): the host writes in/ (box reads only); the box writes out/.
      - ${OCD_HANDOFF_DIR:?OCD_HANDOFF_DIR is set by the bridge}/in:/handoff/in:ro
      - ${OCD_HANDOFF_DIR:?OCD_HANDOFF_DIR is set by the bridge}/out:/handoff/out
      - ${OCD_PROFILE_DIR:?OCD_PROFILE_DIR is set by the bridge}:/profile:ro
    environment:
      XDG_CONFIG_HOME: /profile
      XDG_DATA_HOME: /data
      HOME: /home/agent
      # Box environment contract: docker/caches/README.md "Environment the box needs".
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      https_proxy: http://egress:8888
      http_proxy: http://egress:8888
      NO_PROXY: localhost,127.0.0.1,npm-cache,pypi-cache,inbox
      no_proxy: localhost,127.0.0.1,npm-cache,pypi-cache,inbox
      # MOD-05: the in-box inbox tools post here. No token: box messages are stored unverified.
      OCD_INBOX_URL: http://inbox:8080
      npm_config_registry: http://npm-cache:4873/
      BUN_CONFIG_REGISTRY: http://npm-cache:4873/
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
      PIP_INDEX_URL: http://pypi-cache:5000/index/
      # pip ignores a plain-http index unless the host is trusted (internal network only).
      PIP_TRUSTED_HOST: pypi-cache
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      UV_DEFAULT_INDEX: http://pypi-cache:5000/index/
      UV_INSECURE_HOST: pypi-cache
      OPENCODE_DISABLE_MODELS_FETCH: "1"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      # By name only: values come from the `docker compose` process env, never a file.
      OPENCODE_MCP_ALLOW:
      OPENCODE_SERVER_PASSWORD:
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u \"opencode:$$OPENCODE_SERVER_PASSWORD\" 'http://127.0.0.1:4096/path?directory=/sessions'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on: [egress, inbox]
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]

  # Publishes the box API on the host loopback only (the box itself has no route out).
  gate:
    <<: *hardened
    # Pinned by version and digest (review C-7); resolved 2026-10-01 with
    # `docker buildx imagetools inspect alpine/socat:1.8.1.3` (same index digest as :latest then).
    image: alpine/socat:1.8.1.3@sha256:5ffbd6ae916cbad86a58fabe0d6d5a6fd5c2b47ddf031e82996baac9300e732f
    container_name: ${OCD_CONTAINER:-opencode-delegate}-gate
    user: "65534:65534"
    command: ["TCP-LISTEN:4096,fork,reuseaddr", "TCP:box:4096"]
    networks: [sealed, outside]
    ports: ["127.0.0.1:${OCD_PORT}:4096"]
    # socat forks one process per connection (event streams stay open).
    pids_limit: 256
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    depends_on: [box]

  # The three services below are built from docker/ too (review N-9). Their images are named
  # after the box image, so a new checkout (a new OCD_IMAGE) builds new ones instead of reusing
  # stale ones; Compose builds a missing image on `up`. Each container carries the image label,
  # and the supervisor refuses to reuse a running set whose labels differ (profile_changed).
  # Default-deny HTTPS proxy: the box's only way out (owned by MOD-02, docker/egress).
  egress:
    <<: *hardened
    build: ./egress
    image: ${OCD_IMAGE}-egress
    container_name: ${OCD_CONTAINER:-opencode-delegate}-egress
    labels:
      com.alterspective.opencode-delegate.image: ${OCD_IMAGE}
    networks: [sealed, outside]
    # tinyproxy runs a thread per client (MaxClients 100); the pids limit counts threads.
    pids_limit: 256
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1

  # Read-only pull-through package caches (owned by MOD-02, docker/caches).
  npm-cache:
    <<: *hardened
    build: ./caches/npm
    image: ${OCD_IMAGE}-npm-cache
    container_name: ${OCD_CONTAINER:-opencode-delegate}-npm-cache
    labels:
      com.alterspective.opencode-delegate.image: ${OCD_IMAGE}
    networks: [sealed, outside]
    tmpfs: ["/tmp:mode=1777,nosuid,nodev,noexec"]
    volumes: ["npm-storage:/verdaccio/storage"]
    pids_limit: 256
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1

  pypi-cache:
    <<: *hardened
    build: ./caches/pypi
    image: ${OCD_IMAGE}-pypi-cache
    container_name: ${OCD_CONTAINER:-opencode-delegate}-pypi-cache
    labels:
      com.alterspective.opencode-delegate.image: ${OCD_IMAGE}
    networks: [sealed, outside]
    tmpfs: ["/tmp:uid=101,gid=101,mode=0700,nosuid,nodev,noexec"]
    volumes: ["pypi-storage:/var/cache/nginx/pypi"]
    # nginx starts one worker per host CPU.
    pids_limit: 256
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1

  # MOD-05 agent inbox (technical-design.md §7, review G5; built from ../inbox-sidecar).
  # The box reaches it as http://inbox:8080 on `sealed` with no token, so box messages are
  # stored verified:false. Bridges use the admin routes through the 127.0.0.1 published port with
  # INBOX_ADMIN_TOKEN (by NAME only: from the compose child env, set on THIS service only, never
  # on the box). `outside` is needed only because Docker publishes no ports from a container that
  # is on internal networks alone; the sidecar makes no outbound calls.
  inbox:
    <<: *hardened
    build: ../inbox-sidecar
    image: ${OCD_IMAGE}-inbox
    container_name: ${OCD_CONTAINER:-opencode-delegate}-inbox
    labels:
      com.alterspective.opencode-delegate.image: ${OCD_IMAGE}
      com.alterspective.opencode-delegate.inbox-port: ${OCD_INBOX_PORT:?OCD_INBOX_PORT is set by the bridge}
    networks: [sealed, outside]
    ports: ["127.0.0.1:${OCD_INBOX_PORT}:8080"]
    tmpfs: ["/tmp:mode=1777,nosuid,nodev,noexec"]
    volumes: ["inbox-storage:/data"]
    environment:
      INBOX_PORT: "8080"
      INBOX_DATA_DIR: /data
      INBOX_ADMIN_TOKEN:
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
